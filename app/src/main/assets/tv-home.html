<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HiAnime TV</title>
<style>
:root{--bg:#080b12;--panel:#111725;--panel2:#192235;--text:#f5f7fb;--muted:#9da9bb;--accent:#25e0b2;--line:#283247}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:12px;background:var(--panel2);color:var(--text);padding:13px 20px;font-weight:700}button:focus,input:focus,.tile:focus{outline:3px solid var(--accent);outline-offset:3px}button.primary{background:var(--accent);color:#062018}.app{height:100%;display:grid;grid-template-columns:104px 1fr}.rail{background:#0b101a;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:20px;padding:26px 12px}.brand{font-weight:900;color:var(--accent);font-size:25px;margin-bottom:20px}.rail button{width:64px;height:58px;padding:0;font-size:23px;background:transparent;color:var(--muted)}.rail button.active{background:var(--panel2);color:var(--accent)}main{overflow:auto;padding:26px 38px 55px;scrollbar-width:none}header{display:flex;align-items:center;gap:18px;margin-bottom:22px}header h1{font-size:26px;margin:0 auto 0 0;letter-spacing:-.5px}#searchForm{display:flex;gap:8px;width:min(46vw,560px)}#query{min-width:0;flex:1;background:#121a28;border:1px solid var(--line);border-radius:12px;padding:13px 16px;color:white}.hero{min-height:310px;border-radius:22px;overflow:hidden;position:relative;display:flex;align-items:flex-end;margin-bottom:28px;background:linear-gradient(90deg,#111827 0%,#111827cc 45%,#11182722 100%),linear-gradient(0deg,#080b12,transparent 70%),radial-gradient(ellipse at 75% 25%,#245e69,#18203a 55%,#101520);background-size:cover;background-position:center;padding:30px 34px}.hero-copy{max-width:620px;position:relative;z-index:1}.eyebrow{color:var(--accent);font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.hero h2{font-size:clamp(28px,3vw,48px);line-height:1.05;margin:9px 0 12px;max-width:650px}.hero p{color:#d2d9e4;max-width:560px;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:12px}.section{margin:0 0 30px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section h2{font-size:22px;margin:0}.section-head small{color:var(--muted)}.tiles{display:flex;gap:16px;overflow-x:auto;padding:5px 5px 15px 3px;scrollbar-width:none}.tile{flex:0 0 160px;min-width:0;display:block;color:inherit;text-align:left;background:transparent;border:0;padding:0;border-radius:12px;overflow:visible}.poster{width:100%;height:218px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#202c40,#111725);border:1px solid #2a3447;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .rank{position:absolute;left:8px;top:8px;background:#080b12dd;border-radius:7px;padding:3px 7px;font-size:12px}.tile strong{display:block;font-size:15px;line-height:1.25;margin:9px 2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tile small{display:block;color:var(--muted);margin:0 2px;font-size:12px}.status{color:var(--muted);padding:22px 4px}.empty{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:28px;color:var(--muted)}.details{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:12px 0}.details img{width:100%;border-radius:16px;max-height:360px;object-fit:cover}.details h2{font-size:34px;line-height:1.1;margin:6px 0 12px}.details p{color:#c5cedb;max-width:850px}.episodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}.episode{background:var(--panel);text-align:left;border:1px solid var(--line);padding:14px;font-size:14px}.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}.toolbar button{background:transparent;padding:8px 12px}.hide{display:none!important}.player-shell{position:fixed;inset:0;z-index:1000;background:#05070c;display:flex;flex-direction:column;padding:14px 20px;gap:10px}.player-bar{display:flex;align-items:center;gap:14px;min-height:48px}.player-bar strong{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.player-frame{border:0;width:100%;height:100%;background:#000;flex:1;border-radius:10px}.player-note{color:var(--muted);font-size:13px;margin:0}.player-shell button{padding:8px 14px}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #64748b;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.app{grid-template-columns:78px 1fr}.rail{padding:18px 7px}.rail button{width:56px}.brand{font-size:20px}main{padding:20px}.hero{min-height:260px}.tile{flex-basis:135px}.poster{height:185px}.episodes{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body><div class="app">
<aside class="rail" aria-label="Navigation"><div class="brand">H</div><button class="active" id="navHome" aria-label="Home" title="Home">⌂</button><button id="navSearch" aria-label="Search" title="Search">⌕</button><button id="navPopular" aria-label="My favorites" title="Favorites">★</button><button id="navSite" aria-label="Open website" title="Open website">↗</button></aside>
<main id="main"><header><h1 id="pageTitle">Discover anime</h1><form id="searchForm"><input id="query" type="search" placeholder="Search anime by name" autocomplete="off" aria-label="Search anime"><button class="primary" type="submit">Search</button></form></header><section class="hero" id="hero"><div class="hero-copy"><div class="eyebrow">HIANIME · MADE FOR TV</div><h2>Anime night starts here.</h2><p>Browse the latest series, find your next favorite, and use your remote to explore.</p><div class="actions"><button class="primary" id="heroBrowse">Explore anime</button><button id="heroSite">Open HiAnime</button></div></div></section><div id="content"><div class="status"><span class="spinner"></span>Loading anime catalogue…</div></div></main></div>
<script>
(function(){
'use strict';
var HOME='https://hianime.ms/', HOME_PATH='https://hianime.ms/home';
var content=document.getElementById('content'), hero=document.getElementById('hero'), title=document.getElementById('pageTitle'), query=document.getElementById('query');
var catalogue=[], previousView='home', favorites=[], watchHistory=[];try{favorites=JSON.parse(localStorage.getItem('hianime-tv-favorites')||'[]');if(!Array.isArray(favorites))favorites=[]}catch(e){favorites=[]}try{watchHistory=JSON.parse(localStorage.getItem('hianime-tv-history')||'[]');if(!Array.isArray(watchHistory))watchHistory=[]}catch(e){watchHistory=[]}
function abs(v){try{return new URL(v,HOME).href}catch(e){return ''}}
function clean(s){return (s||'').replace(/\s+/g,' ').trim()}
function isWatch(url){return /\/watch(?:\/|-)/i.test(url||'')}
function sameSite(url){try{var host=new URL(url).hostname.toLowerCase();return host==='hianime.ms'||host.endsWith('.hianime.ms')}catch(e){return false}}
function saveWatchHistory(){try{localStorage.setItem('hianime-tv-history',JSON.stringify(watchHistory))}catch(e){}}
function rememberWatch(item,episode){var entry={title:item.title,url:item.url,image:item.image||'',meta:item.meta||'',resumeUrl:episode.url,episodeLabel:episode.label||'Continue watching'};watchHistory=[entry].concat(watchHistory.filter(function(x){return x.url!==item.url})).slice(0,12);saveWatchHistory()}
function saveFavorites(){try{localStorage.setItem('hianime-tv-favorites',JSON.stringify(favorites))}catch(e){}}
function isFavorite(item){return favorites.some(function(x){return x.url===item.url})}
function toggleFavorite(item){if(isFavorite(item))favorites=favorites.filter(function(x){return x.url!==item.url});else favorites.unshift({title:item.title,url:item.url,image:item.image||'',meta:item.meta||''});saveFavorites();return isFavorite(item)}
function showFavorites(){hero.classList.add('hide');title.textContent='My favorites';var list=favorites.slice();renderRows(list.length?[{name:'Saved anime',items:list}]:[],list,list.length?'':'No favorites saved yet. Open an anime and choose “Add to favorites” to save it.')}
function makeTile(item,index){var b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label',item.title);b.innerHTML='<div class="poster">'+(item.image?'<img loading="lazy" alt="" src="'+item.image.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">':'')+(index<3?'<span class="rank">FEATURED</span>':'')+'</div><strong></strong><small></small>';b.querySelector('strong').textContent=item.title;b.querySelector('small').textContent=item.meta||'Anime';b.addEventListener('click',function(){if(item.resumeUrl)playEpisode(item,{url:item.resumeUrl,label:item.episodeLabel||'Continue watching'});else openDetails(item)});return b}
function cardItems(doc){var seen={},out=[];Array.prototype.forEach.call(doc.querySelectorAll('a[href]'),function(a){var href=abs(a.getAttribute('href'));if(!sameSite(href)||/\/watch(?:\/|-)/i.test(new URL(href).pathname)||/\/(search|genre|category|home|schedule|az-list|movie|tv|most-popular|top-airing|newest|random)(\/|\?|$)/i.test(new URL(href).pathname))return;var img=a.querySelector('img')||(a.parentElement&&a.parentElement.querySelector('img'));var text=clean((a.querySelector('.film-name,.dynamic-name,.film-title,.title')||{}).textContent||a.getAttribute('title')||a.getAttribute('aria-label')||a.textContent||(img&&img.alt));if(!text&&img)text=clean(img.alt);if(!text||text.length>100||text.length<2||/^(watch now|details|see all|view all|home|search|login|sign in)$/i.test(text))return;var image=img?abs(img.getAttribute('data-src')||img.getAttribute('data-lazy-src')||img.getAttribute('src')||''):'';if(image.indexOf('data:')===0)image='';var key=href+'|'+text.toLowerCase();if(seen[key])return;seen[key]=1;var parent=a.closest('.film-item,.flw-item,.item,.block_area .item,.film_list-wrap .flw-item')||a.parentElement;var meta=clean(parent&&parent.innerText||'').replace(text,'').slice(0,65);out.push({title:text,url:href,image:image,meta:meta})});return out}
function parseRows(doc){var rows=[],seen={};Array.prototype.forEach.call(doc.querySelectorAll('h2,h3,.block_area-header .cat-heading,.block_area-header h2'),function(h){var name=clean(h.textContent);if(!name||name.length>70||seen[name.toLowerCase()])return;seen[name.toLowerCase()]=1;var node=h.parentElement;for(var i=0;i<3&&node;i++,node=node.parentElement){var items=cardItems(node);if(items.length>=3){rows.push({name:name,items:items.slice(0,24)});break}}});return rows}
function renderRows(rows,items,label){content.innerHTML='';if(label){var intro=document.createElement('div');intro.className='status';intro.textContent=label;content.appendChild(intro)}var used={};rows.forEach(function(row){var filtered=row.items.filter(function(x){if(used[x.url])return false;used[x.url]=1;return true});if(!filtered.length)return;var sec=document.createElement('section');sec.className='section';var head=document.createElement('div');head.className='section-head';head.innerHTML='<h2></h2><small>Use ← → to browse</small>';head.querySelector('h2').textContent=row.name;var tiles=document.createElement('div');tiles.className='tiles';filtered.forEach(function(item,i){tiles.appendChild(makeTile(item,i))});sec.appendChild(head);sec.appendChild(tiles);content.appendChild(sec)});if(!content.children.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='The catalogue could not be read from the website. You can still open HiAnime directly.';var btn=document.createElement('button');btn.className='primary';btn.textContent='Open website';btn.onclick=function(){location.href=HOME};empty.appendChild(document.createElement('p'));empty.appendChild(btn);content.appendChild(empty)}}
function pickHero(items,doc){var h=doc.querySelector('.desi-sub-text,.desi-head-title,h1');var name=clean(h&&h.textContent)||'Discover your next favorite';var description=clean((doc.querySelector('meta[name="description"]')||{}).content||'Browse anime series, movies, and new episodes with a remote-friendly interface.');var heroItem=items.find(function(x){return x.image});var image=heroItem?heroItem.image:'';if(image)hero.style.backgroundImage='linear-gradient(90deg,#080b12 0%,#080b12dd 40%,#080b1244 100%),linear-gradient(0deg,#080b12,transparent 65%),url("'+image.replace(/"/g,'')+'")';hero.querySelector('h2').textContent=name;hero.querySelector('p').textContent=description}
function playEpisode(item,episode){if(!episode||!sameSite(episode.url)||!isWatch(episode.url)){content.innerHTML='<div class="empty">This episode link is not a valid HiAnime watch URL.</div>';return}rememberWatch(item,episode);var old=document.getElementById('playerShell');if(old)old.remove();var shell=document.createElement('section');shell.id='playerShell';shell.className='player-shell';shell.setAttribute('role','dialog');shell.setAttribute('aria-label','Anime playback');var bar=document.createElement('div');bar.className='player-bar';var close=document.createElement('button');close.className='primary';close.textContent='← Back to HiAnime TV';close.onclick=function(){window.hianimeTvClosePlayer();title.textContent='Anime details';};var label=document.createElement('strong');label.textContent=item.title+' · '+(episode.label||'Episode');var open=document.createElement('button');open.textContent='Open full player';open.onclick=function(){location.href=episode.url};bar.appendChild(close);bar.appendChild(label);bar.appendChild(open);var note=document.createElement('p');note.className='player-note';note.setAttribute('role','status');note.setAttribute('aria-live','polite');note.textContent='Loading episode player… Playback is hosted by HiAnime. If video does not appear, choose “Open full player”; Back returns to the TV interface.';var retry=document.createElement('button');retry.textContent='Reload player';retry.onclick=function(){note.textContent='Reloading episode player…';frame.src='about:blank';window.setTimeout(function(){frame.src=episode.url},80)};retry.style.display='none';var frame=document.createElement('iframe');frame.className='player-frame';frame.title='HiAnime episode player';frame.src=episode.url;frame.setAttribute('allow','autoplay; fullscreen; picture-in-picture; encrypted-media');frame.setAttribute('allowfullscreen','');frame.addEventListener('load',function(){if(document.getElementById('playerShell')!==shell)return;note.textContent='Player page loaded. If video is blank or playback is blocked, choose “Open full player”.';retry.style.display='inline-block'});frame.addEventListener('error',function(){note.textContent='The player could not load. Try reloading or open the full player.';retry.style.display='inline-block'});frame.addEventListener('focus',function(){try{if(window.HiAnimeTvBridge)window.HiAnimeTvBridge.setPlayerFocus(true)}catch(e){}});frame.addEventListener('blur',function(){try{if(window.HiAnimeTvBridge)window.HiAnimeTvBridge.setPlayerFocus(false)}catch(e){}});shell.appendChild(bar);shell.appendChild(note);bar.insertBefore(retry,open);shell.appendChild(frame);document.body.appendChild(shell);window.setTimeout(function(){if(document.getElementById('playerShell')===shell&&note.textContent.indexOf('Loading episode player')===0){note.textContent='The player is taking longer than expected. Try reloading or open the full player.';retry.style.display='inline-block'}},12000);close.focus();}function parseDoc(html){return new DOMParser().parseFromString(html,'text/html')}
async function loadHome(fromHistory){previousView='home';if(fromHistory!==false){try{history.replaceState({view:'home'},'','/')}catch(e){}}title.textContent='Discover anime';content.innerHTML='<div class="status"><span class="spinner"></span>Loading anime catalogue…</div>';hero.classList.remove('hide');try{var responses=await Promise.all([fetch(HOME,{credentials:'include'}).catch(function(){return null}),fetch(HOME_PATH,{credentials:'include'}).catch(function(){return null})]);var docs=[];for(var r of responses){if(r&&r.ok){try{docs.push(parseDoc(await r.text()))}catch(parseError){}}}var rows=[],all=[];docs.forEach(function(doc){rows=rows.concat(parseRows(doc));all=all.concat(cardItems(doc))});var unique={},items=all.filter(function(x){if(unique[x.url])return false;unique[x.url]=1;return true});catalogue=items;pickHero(items,docs[1]||docs[0]||document);if(!rows.length&&items.length)rows=[{name:'Popular anime',items:items}];if(watchHistory.length)rows.unshift({name:'Continue Watching',items:watchHistory});renderRows(rows,items,'');if(!items.length)throw new Error('No catalogue cards found')}catch(e){content.innerHTML='<div class="empty"><h2>Catalogue unavailable</h2><p>HiAnime did not return readable catalogue data. The TV interface is ready, but the live source may be temporarily unavailable.</p><button class="primary" id="retry">Try again</button> <button id="direct">Open website</button></div>';document.getElementById('retry').onclick=loadHome;document.getElementById('direct').onclick=function(){location.href=HOME}}}
async function searchAnime(term,fromHistory){previousView='search';if(fromHistory!==false){try{history.pushState({view:'search',term:term},'','/search?keyword='+encodeURIComponent(term))}catch(e){}}hero.classList.add('hide');title.textContent='Search results';content.innerHTML='<div class="status"><span class="spinner"></span>Searching…</div>';try{var url=new URL('/search',HOME);url.searchParams.set('keyword',term);var r=await fetch(url.href,{credentials:'include'});if(!r.ok)throw 0;var doc=parseDoc(await r.text()),items=cardItems(doc);catalogue=items;renderRows(items.length?[{name:'Results for “'+term+'”',items:items}]:[],items,items.length?'':'No results found. Try a different title.')}catch(e){content.innerHTML='<div class="empty">Search could not be completed. <button class="primary" id="retrySearch">Retry search</button></div>';document.getElementById('retrySearch').onclick=function(){searchAnime(term,false)}}}
async function openDetails(item,fromHistory){previousView='details';if(fromHistory!==false){try{history.pushState({view:'details',item:item},'',new URL(item.url).pathname+new URL(item.url).search)}catch(e){}}hero.classList.add('hide');title.textContent='Anime details';content.innerHTML='<div class="status"><span class="spinner"></span>Loading '+item.title+'…</div>';try{var r=await fetch(item.url,{credentials:'include'});if(!r.ok)throw 0;var doc=parseDoc(await r.text());var h=doc.querySelector('h1,.film-name');var name=clean(h&&h.textContent)||item.title;var description=clean((doc.querySelector('.film-description,.description,.text,.content')||{}).textContent||(doc.querySelector('meta[name="description"]')||{}).content||'');var image=item.image||abs((doc.querySelector('.film-poster img, .anisc-poster img, .film-poster')||{}).src||'');var eps=[],seen={};var episodeLinks=doc.querySelectorAll('.ss-list a[href],.episodes a[href],.ep-list a[href],.episode-list a[href],.ep-item[href],a[href*="?ep="],a[href*="&ep="]');if(!episodeLinks.length)episodeLinks=doc.querySelectorAll('a[href]');Array.prototype.forEach.call(episodeLinks,function(a){var url=abs(a.getAttribute('href'));if(!isWatch(url)||seen[url])return;var label=clean(a.innerText||a.getAttribute('title')||a.getAttribute('aria-label'));if(!label)label='Episode '+(eps.length+1);if(label.length>100)return;seen[url]=1;eps.push({url:url,label:label})});content.innerHTML='';var detail=document.createElement('section');detail.className='details';var poster=document.createElement('div');poster.innerHTML=image?'<img alt="" src="'+image.replace(/"/g,'&quot;')+'">':'<div class="poster"></div>';var info=document.createElement('div');info.innerHTML='<div class="eyebrow">ANIME DETAILS</div><h2></h2><p></p><div class="actions"><button class="primary" id="playFirst">▶ Play first episode</button><button id="favoriteToggle">☆ Add to favorites</button><button id="backBrowse">← Browse</button></div><h3>Episodes</h3><div class="episodes" id="episodes"></div>';info.querySelector('h2').textContent=name;info.querySelector('p').textContent=description||'Choose an episode to continue on HiAnime.';detail.appendChild(poster);detail.appendChild(info);content.appendChild(detail);var list=info.querySelector('#episodes');eps.slice(0,100).forEach(function(ep,i){var b=document.createElement('button');b.className='episode';b.textContent=ep.label;b.onclick=function(){playEpisode(item,ep)};list.appendChild(b)});info.querySelector('#playFirst').disabled=!eps.length;info.querySelector('#playFirst').onclick=function(){if(eps[0])playEpisode(item,eps[0])};var favoriteButton=info.querySelector('#favoriteToggle');favoriteButton.textContent=isFavorite(item)?'★ Remove from favorites':'☆ Add to favorites';favoriteButton.onclick=function(){var saved=toggleFavorite(item);favoriteButton.textContent=saved?'★ Remove from favorites':'☆ Add to favorites'};info.querySelector('#backBrowse').onclick=function(){if(history.state&&history.state.view==='details'&&history.length>1)history.back();else loadHome(false)};if(!eps.length){var note=document.createElement('p');note.textContent='No episode links were detected on this page. Open the title page to use the site’s own episode list.';info.appendChild(note);var open=document.createElement('button');open.textContent='Open title on HiAnime';open.onclick=function(){location.href=item.url};info.appendChild(open)}}catch(e){content.innerHTML='<div class="empty"><h2></h2><p>Could not load the title details.</p><button class="primary" id="returnHome">Back to browse</button> <button id="openTitle">Open title page</button></div>';content.querySelector('h2').textContent=item.title;document.getElementById('returnHome').onclick=loadHome;document.getElementById('openTitle').onclick=function(){location.href=item.url}}}
document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();var term=clean(query.value);if(term)searchAnime(term)});
document.getElementById('navHome').onclick=loadHome;document.getElementById('navSearch').onclick=function(){query.focus()};document.getElementById('navPopular').onclick=showFavorites;document.getElementById('navSite').onclick=function(){location.href=HOME};document.getElementById('heroBrowse').onclick=function(){query.focus()};document.getElementById('heroSite').onclick=function(){location.href=HOME};
window.hianimeTvClosePlayer=function(){var shell=document.getElementById('playerShell');if(!shell)return false;try{if(window.HiAnimeTvBridge)window.HiAnimeTvBridge.setPlayerFocus(false)}catch(e){}shell.remove();return true};
document.addEventListener('keydown',function(e){if((e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT')&&document.getElementById('playerShell')){window.hianimeTvClosePlayer();e.preventDefault();return}if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){if(previousView==='details'){loadHome();e.preventDefault()}}});
window.addEventListener('popstate',function(event){var state=event.state;if(!state||state.view==='home'){loadHome(false)}else if(state.view==='search'){searchAnime(state.term||'',false)}else if(state.view==='details'&&state.item){openDetails(state.item,false)}else{loadHome(false)}});
loadHome(false);
})();
</script></body></html>
